#  https://github.com/mheap/github-action-required-labels
name: Pull Request Required Labels
permissions:
  contents: read
  issues: read
  pull-requests: read
on:
  pull_request:
    types: [ opened, labeled, unlabeled, synchronize ]
jobs:
  label:
    if: github.event.pull_request.state == 'open'
    runs-on: ubuntu-latest
    name: Verify Pull Request has labels
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Required-labels
        uses: mheap/github-action-required-labels@23e10fde7e062233401931a0eece796cd9bf3177 # v5.6.0
        with:
          mode: minimum
          count: 1
          labels: "breaking, breaks, feature, enhancement, fix, bugfix, bug, chore, cleanup, polish, dependencies, documentation"
